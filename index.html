<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HARAKABET V5 CASINO</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff}.t{background:#1a5d1a;padding:10px;display:flex;justify-content:space-between}.l{font-weight:900}.l b{color:#ffcc00}.b{color:#ffcc00;font-weight:bold}.bt{padding:6px 9px;border:none;border-radius:5px;font-weight:bold;margin-left:2px}.y{background:#ffcc00}.w{background:#fff}.n{display:flex;background:#111}.n div{padding:10px;flex:1;text-align:center;font-size:13px}.ac{border-bottom:3px solid #ffcc00;color:#ffcc00}.m{background:#1e1e1e;margin:6px;padding:10px;border-radius:6px;display:flex;justify-content:space-between}.o{background:#2a2a2a;padding:5px 7px;border-radius:4px}.p{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:99}.q{background:#1e1e1e;padding:15px;border-radius:10px;width:92%;max-width:330px}.q input{width:100%;padding:9px;margin:6px 0;border-radius:5px;border:none}.q button{width:100%;padding:10px;background:#ffcc00;border:none;border-radius:5px;font-weight:bold;margin-top:5px}.av{background:linear-gradient(180deg,#1a1a2e,#16213e);margin:8px;border-radius:10px;padding:15px;text-align:center;display:none}#cr{font-size:40px;color:#ffcc00;font-weight:900}.ca{display:none;margin:8px}.cg{background:#1e1e1e;padding:12px;border-radius:8px;margin-bottom:8px;text-align:center}.cb{padding:8px 15px;margin:4px;border:none;border-radius:5px;font-weight:bold}.gb{background:#ffcc00}.rb{background:#ff4444;color:#fff}</style></head><body>
<div class="t"><div class="l">HARAKA<b>BET</b> V5</div><div><span class="b">KES <span id="ba">750</span></span><button class="bt y" onclick="oD()">DEP</button><button class="bt w" onclick="oW()">WIT</button></div></div>
<div class="n"><div id="t1" class="ac" onclick="sT(1)">SPORTS</div><div id="t2" onclick="sT(2)">AVIATOR</div><div id="t3" onclick="sT(3)">CASINO</div></div>

<div id="sP"><div class="m"><span>Man City vs Arsenal</span><div><span class="o" onclick="bE(2.1)">2.1</span><span class="o" onclick="bE(3.2)">3.2</span><span class="o" onclick="bE(3)">3.0</span></div></div><div class="m"><span>Barca vs Real</span><div><span class="o" onclick="bE(2.5)">2.5</span><span class="o" onclick="bE(3.1)">3.1</span><span class="o" onclick="bE(2.8)">2.8</span></div></div><div class="m"><span>Gor vs AFC</span><div><span class="o" onclick="bE(1.9)">1.9</span><span class="o" onclick="bE(3)">3.0</span><span class="o" onclick="bE(3.5)">3.5</span></div></div></div>

<div id="aP" class="av"><div id="cr">1.00x</div><p id="am">✈️ Inaruka...</p><input id="avS" type="number" placeholder="100" style="width:60%;padding:8px;border-radius:5px;border:none;margin:8px"><br><button id="avB" onclick="sAv()" class="cb gb">BET</button><p style="font-size:10px;margin-top:8px">DEMO 18+</p></div>

<div id="cP" class="ca">
<div class="cg"><h3>🎲 DICE - Chagua Chini/Juu ya 50</h3><p id="diR" style="font-size:24px;margin:8px">--</p><input id="diS" type="number" placeholder="Stake 50" style="width:60%;padding:7px;border-radius:5px;border:none"><br><button class="cb gb" onclick="pD('low')">LOW (0-49)</button><button class="cb rb" onclick="pD('high')">HIGH (50-99)</button></div>
<div class="cg"><h3>🪙 COIN FLIP x2.0</h3><p id="coR" style="font-size:22px">--</p><input id="coS" type="number" placeholder="Stake 50" style="width:60%;padding:7px;border-radius:5px;border:none"><br><button class="cb gb" onclick="pC('heads')">HEADS</button><button class="cb rb" onclick="pC('tails')">TAILS</button></div>
<div class="cg"><h3>🎡 WHEEL x3.0</h3><p id="whR" style="font-size:22px">🎡 --</p><input id="whS" type="number" placeholder="Stake 50" style="width:60%;padding:7px;border-radius:5px;border:none"><br><button class="cb gb" onclick="pW()">SPIN WHEEL</button><p style="font-size:10px">Shinda kama ni GREEN</p></div>
</div>

<div class="p" id="dM"><div class="q"><h3>Deposit</h3><input id="dP" placeholder="07xx"><input id="dA" type="number" placeholder="Amount"><button onclick="dD()">LIPA</button><button onclick="cD()" style="background:#444;color:#fff">Funga</button><p id="dG"></p></div></div>
<div class="p" id="wM"><div class="q"><h3>Withdraw</h3><input id="wP" placeholder="07xx"><input id="wA" type="number" placeholder="Amount"><button onclick="dW()">TOA</button><button onclick="cW()" style="background:#444;color:#fff">Funga</button><p id="wG"></p></div></div>

<script>
let bal=parseFloat(localStorage.getItem('hb')||750);document.getElementById('ba').innerText=bal;
function sv(){localStorage.setItem('hb',bal);document.getElementById('ba').innerText=bal}
function sT(n){document.getElementById('sP').style.display=n==1?'block':'none';document.getElementById('aP').style.display=n==2?'block':'none';document.getElementById('cP').style.display=n==3?'block':'none';document.getElementById('t1').className=n==1?'ac':'';document.getElementById('t2').className=n==2?'ac':'';document.getElementById('t3').className=n==3?'ac':''}
function bE(od){let s=prompt('Odd '+od+' Stake?');if(!s)return;let st=parseFloat(s);if(st>bal)return alert('Balance low');bal-=st;sv();setTimeout(()=>{if(Math.random()>0.5){let w=st*od;bal+=w;sv();alert('WIN '+w.toFixed(0))}else alert('Lost')},700)}
function oD(){document.getElementById('dM').style.display='flex'}function cD(){document.getElementById('dM').style.display='none'}function oW(){document.getElementById('wM').style.display='flex'}function cW(){document.getElementById('wM').style.display='none'}
function dD(){let a=parseFloat(document.getElementById('dA').value);if(!a)return;bal+=a;sv();cD()}function dW(){let a=parseFloat(document.getElementById('wA').value);if(!a||a>bal)return alert('low bal');bal-=a;sv();cW()}
let cr=1,run=false,bet=0;function sAv(){if(run){let win=bet*cr;bal+=win;sv();document.getElementById('am').innerText='WIN '+win.toFixed(0);run=false;document.getElementById('avB').innerText='BET';return}bet=parseFloat(document.getElementById('avS').value);if(!bet||bet>bal)return alert('Stake?');bal-=bet;sv();run=true;cr=1;document.getElementById('avB').innerText='CASHOUT';let tar=1+Math.random()*5;let iv=setInterval(()=>{if(!run){clearInterval(iv);return}cr+=0.07;document.getElementById('cr').innerText=cr.toFixed(2)+'x';if(cr>=tar){clearInterval(iv);run=false;document.getElementById('am').innerText='CRASHED '+cr.toFixed(2)+'x';document.getElementById('avB').innerText='BET';}},100)}
function pD(ch){let s=parseFloat(document.getElementById('diS').value);if(!s||s>bal)return alert('Stake?');bal-=s;sv();let r=Math.floor(Math.random()*100);document.getElementById('diR').innerText='Roll: '+r;let win=(ch=='low'&&r<50)||(ch=='high'&&r>=50);if(win){bal+=s*2;sv();alert('WIN! x2')}else alert('LOST')}
function pC(ch){let s=parseFloat(document.getElementById('coS').value);if(!s||s>bal)return alert('Stake?');bal-=s;sv();let r=Math.random()>0.5?'heads':'tails';document.getElementById('coR').innerText=r.toUpperCase();if(r==ch){bal+=s*2;sv();alert('WIN x2')}else alert('LOST')}
function pW(){let s=parseFloat(document.getElementById('whS').value);if(!s||s>bal)return alert('Stake?');bal-=s;sv();let cols=['red','red','red','green'];let r=cols[Math.floor(Math.random()*4)];document.getElementById('whR').innerText=r.toUpperCase();if(r=='green'){bal+=s*3;sv();alert('JACKPOT x3!')}else alert('Lost - red')}
</script></body></html>
