<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harakabet</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff}.top{background:#1a5d1a;padding:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.logo{font-weight:900;font-size:20px} .logo b{color:#ffcc00}.bal{color:#ffcc00;font-weight:bold}.bt{padding:7px 11px;border:none;border-radius:5px;font-weight:bold;margin-left:4px}.de{background:#ffcc00}.wi{background:#fff;color:#000}.nav{display:flex;background:#111}.nav div{padding:11px 15px}.ac{border-bottom:3px solid #ffcc00;color:#ffcc00}.ma{background:#1e1e1e;margin:7px;padding:11px;border-radius:7px;display:flex;justify-content:space-between;align-items:center}.od{background:#2a2a2a;padding:5px 8px;border-radius:4px;margin:2px;cursor:pointer}.md{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:99}.bx{background:#1e1e1e;padding:18px;border-radius:10px;width:90%;max-width:340px}.bx input{width:100%;padding:10px;margin:7px 0;border-radius:5px;border:none}.bx button{width:100%;padding:11px;background:#ffcc00;border:none;border-radius:6px;font-weight:bold;margin-top:6px}</style></head><body><div class="top"><div class="logo">HARAKA<b>BET</b></div><div><span class="bal">KES <span id="bal">1250</span></span><button class="bt de" onclick="oD()">+ DEPOSIT</button><button class="bt wi" onclick="oW()">WITHDRAW</button></div></div><div class="nav"><div class="ac">⚽ Sports</div><div>✈️ Aviator</div></div><div class="ma"><span>Man City vs Arsenal</span><div><span class="od" onclick="bT('Man City 2.10')">2.10</span><span class="od" onclick="bT('Draw 3.20')">3.20</span><span class="od" onclick="bT('Arsenal 3.00')">3.00</span></div></div><div class="ma"><span>Barca vs Real</span><div><span class="od" onclick="bT('Barca 2.50')">2.50</span><span class="od" onclick="bT('Draw 3.10')">3.10</span><span class="od" onclick="bT('Real 2.80')">2.80</span></div></div><div class="ma"><span>Gor Mahia vs AFC</span><div><span class="od" onclick="bT('Gor 1.90')">1.90</span><span class="od" onclick="bT('Draw 3.00')">3.00</span><span class="od" onclick="bT('AFC 3.50')">3.50</span></div></div><div class="ma"><span>Chelsea vs Liverpool</span><div><span class="od" onclick="bT('Chelsea 2.30')">2.30</span><span class="od" onclick="bT('Draw 3.20')">3.20</span><span class="od" onclick="bT('Liverpool 2.90')">2.90</span></div></div><div class="md" id="dM"><div class="bx"><h3>Deposit M-Pesa</h3><input id="dP" placeholder="07XX XXX XXX"><input id="dA" type="number" placeholder="Amount"><button onclick="dD()">LIPA SASA</button><button onclick="cD()" style="background:#444;color:#fff">Funga</button><p id="dMg" style="color:#ffcc00;margin-top:8px"></p></div></div><div class="md" id="wM"><div class="bx"><h3>Withdraw</h3><input id="wP" placeholder="07XX XXX XXX"><input id="wA" type="number" placeholder="Amount"><button onclick="dW()">TOA PESA</button><button onclick="cW()" style="background:#444;color:#fff">Funga</button><p id="wMg" style="color:#ffcc00;margin-top:8px"></p></div></div><script>let bal=parseFloat(localStorage.getItem('hb')||1250);document.getElementById('bal').innerText=bal;function sv(){localStorage.setItem('hb',bal);document.getElementById('bal').innerText=bal}function bT(t){let s=prompt(t+"\nWeka Stake KES:");if(!s)return;let st=parseFloat(s);if(st>bal)return alert('Balance haitoshi! Deposit kwanza');bal-=st;sv();let win=st*2.2;setTimeout(()=>{if(Math.random()>0.45){bal+=win;sv();alert('UMESHINDA! KES '+win.toFixed(0))}else alert('Pole! Jaribu tena');},1200)}function oD(){document.getElementById('dM').style.display='flex'}function cD(){document.getElementById('dM').style.display='none'}function oW(){document.getElementById('wM').style.display='flex'}function cW(){document.getElementById('wM').style.display='none'}function dD(){let a=parseFloat(document.getElementById('dA').value);let p=document.getElementById('dP').value;if(!a||!p)return alert('Jaza namba na amount');document.getElementById('dMg').innerText='STK Push kwa '+p+'...';setTimeout(()=>{bal+=a;sv();document.getElementById('dMg').innerText='Success! KES '+a+' imeongezwa!';setTimeout(cD,1500)},1800)}function dW(){let a=parseFloat(document.getElementById('wA').value);let p=document.getElementById('wP').value;if(!a||!p)return alert('Jaza zote');if(a>bal)return alert('Balance haitoshi');document.getElementById('wMg').innerText='Inatuma KES '+a+' kwa '+p+'...';setTimeout(()=>{bal-=a;sv();document.getElementById('wMg').innerText='Imetumwa! Angalia M-Pesa';setTimeout(cW,1500)},1800)}</script></body></html>
